<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아침 서재 — 연결할 수 없습니다</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website"><meta property="og:site_name" content="아침 서재"><meta property="og:title" content="아침 서재 — 이 주소는 닫혔습니다"><meta property="og:description" content="이 주소의 아침 서재는 더 이상 연결할 수 없습니다.">
<style>
:root{--ink:#2b2420;--soft:#6b5d52;--paper:#fbf6ee;--desk:#efe6d8;--acc:#7a2e2a;--edge:#e2d6c4;--hi:#fff3d6;--ok:#2f6b4a}
@media (prefers-color-scheme:dark){:root{--ink:#efe6da;--soft:#b9ab9c;--paper:#2a2420;--desk:#1f1a17;--acc:#e08a7e;--edge:#463c34;--hi:#3a3024;--ok:#8fd1aa}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--ink);font:17px/1.7 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:break-word;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px}
main{width:min(540px,100%);background:var(--paper);border:1px solid var(--edge);border-top:5px solid var(--acc);border-radius:14px;padding:26px 22px 18px;box-shadow:0 20px 50px -24px rgba(0,0,0,.45)}
.kick{font-size:14px;font-weight:800;color:var(--acc);letter-spacing:.04em;margin:0 0 4px}
h1{font-size:25px;line-height:1.35;margin:0 0 12px}
p{margin:0 0 12px}.soft{color:var(--soft);font-size:15px}
.box{border:2px solid var(--ok);background:var(--hi);border-radius:12px;padding:12px 14px;margin:16px 0 8px}
button{font:inherit;font-weight:800;font-size:16px;width:100%;padding:12px 16px;border-radius:10px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;margin:6px 0 8px}
.msg{font-size:14.5px;color:var(--ok);font-weight:700;min-height:1em;margin:0}
footer{margin-top:18px;border-top:1px dashed var(--edge);padding-top:12px}
</style></head><body><main>
<p class="kick">아침 서재</p>
<h1>이 주소의 아침 서재는 더 이상 연결할 수 없습니다</h1>
<p>그동안 아침 서재를 써 주셔서 고맙습니다. 이 주소는 이제 쓰지 않습니다.</p>
<p class="soft">구글로 쓰신 글은 내 구글 드라이브의 「아침 서재」 폴더에 그대로 남아 있습니다.</p>
<div class="box" id="local" hidden>
  <p style="margin:0 0 4px"><b>이 기기에만 있는 글이 있어요</b></p>
  <p class="soft" style="margin:0">「구글 없이 이 기기에서」 쓰신 글은 이 기기 안에만 있습니다. 아래 단추로 파일을 받아 간직해 두세요.</p>
  <button type="button" id="dl">이 기기의 글을 파일로 받기</button>
  <p class="msg" id="dlmsg"></p>
</div>
<footer><p class="soft" style="margin:0">아침 서재 · 아빠 임요한 목사와 딸 임하은 작가</p></footer>
</main>
<script>
(function(){
  var $=function(id){ return document.getElementById(id); };
  var ls=function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } };
  // 이 주소에 남은 예전 앱의 오프라인 사본(서비스 워커·캐시)만 지움 — 예전 화면이 다시 뜨지 않게
  var HERE=location.pathname.replace(/[^\/]*$/,"");
  try{ if(navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ try{ if(new URL(r.scope).pathname===HERE) r.unregister(); }catch(e){} }); }); }catch(e){}
  try{ if(window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ if(k==="seojae-open-v1") caches.delete(k); }); }); }catch(e){}
  function idbRead(){ return new Promise(function(ok){ try{ var r=indexedDB.open("seojae-open",1); r.onupgradeneeded=function(){ try{ r.result.createObjectStore("kv"); }catch(e){} };
    r.onsuccess=function(){ try{ var q=r.result.transaction("kv").objectStore("kv").get("local:data"); q.onsuccess=function(){ ok(q.result||null); }; q.onerror=function(){ ok(null); }; }catch(e){ ok(null); } }; r.onerror=function(){ ok(null); }; }catch(e){ ok(null); } }); }
  idbRead().then(function(t){ var text=t||ls("seojae-open.morningStudy.v2"), d=null; try{ d=JSON.parse(text||"null"); }catch(e){}
    var has=d&&((d.writings||[]).length||Object.keys(d.diary||{}).length||(d.jots||[]).length||(d.books||[]).length||(d.notes||[]).length);
    if(!has) return;
    $("local").hidden=false;
    $("dl").onclick=function(){ var day=new Date().toISOString().slice(0,10), name="아침서재-백업-"+day+".json",
        body=JSON.stringify({app:"아침 서재",kind:"backup",build:"닫힌주소",at:new Date().toISOString(),data:d});
      var f; try{ f=new File([body],name,{type:"application/json"}); }catch(e){}
      if(f&&navigator.canShare&&navigator.canShare({files:[f]})&&matchMedia("(pointer:coarse)").matches){ navigator.share({files:[f],title:"아침 서재 백업"}).catch(function(){}); }
      else { var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([body],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },800); }
      $("dlmsg").textContent="파일을 받았어요. 글 "+(d.writings||[]).length+"편 · 일기 "+Object.keys(d.diary||{}).length+"날이 들어 있어요."; };
  });
})();
</script>
</body></html>
